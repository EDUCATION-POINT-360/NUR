<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUR - Authentic Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Plus+Jakarta+Sans:wght@300;500;800&display=swap');
        .font-urdu { font-family: 'Noto Nastaliq Urdu', serif; line-height: 2.5; direction: rtl; }
        .font-eng { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-radius: 1.5rem; border: 1px solid white; }
    </style>
</head>
<body class="bg-gray-100 p-4 md:p-10 font-eng">

    <div class="max-w-4xl mx-auto space-y-6">
        <div class="glass p-6 shadow-sm flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-black tracking-tighter">NUR🌙</h1>
                <p id="hijri-date" class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mt-1">Loading Date...</p>
            </div>
            <div id="prayer-display" class="text-right text-[10px] font-bold text-emerald-600 space-y-1">
                Fetching Prayer Times...
            </div>
        </div>

        <div class="glass p-2 shadow-lg flex">
            <input type="text" id="query" placeholder="Search Quran or Hadith..." class="w-full p-4 bg-transparent outline-none text-sm italic">
            <button onclick="runGlobalSearch()" class="bg-slate-900 text-white px-10 py-3 rounded-2xl text-xs font-bold hover:bg-emerald-600 transition-all">SEARCH</button>
        </div>

        <div id="feed" class="space-y-6">
            <div class="p-20 text-center text-gray-400 animate-pulse font-bold">Connecting to Global Islamic Servers...</div>
        </div>
    </div>

    <script>
        // API CONFIGURATION
        const CONFIG = {
            // Using a public proxy to avoid "API ERROR" or "CORS ERROR"
            PROXY: "https://api.allorigins.win/raw?url=",
            HADITH_API: "https://cdn.jsdelivr.net/gh/fawazaheed/hadith-api@1/editions/eng-bukhari.min.json",
            HADITH_URDU: "https://cdn.jsdelivr.net/gh/fawazaheed/hadith-api@1/editions/urd-bukhari.min.json",
            PRAYER_API: "https://api.aladhan.com/v1/timingsByCity?city=Karachi&country=Pakistan&method=2"
        };

        let library = [];

        async function initNUR() {
            try {
                // 1. Get Prayer Times
                const pRes = await fetch(CONFIG.PRAYER_API);
                const pData = await pRes.json();
                document.getElementById('prayer-display').innerHTML = `FAJR: ${pData.data.timings.Fajr} | MAGHRIB: ${pData.data.timings.Maghrib}`;
                document.getElementById('hijri-date').innerText = pData.data.date.hijri.date + " AH";

                // 2. Get Hadith (The "Error-Free" Way)
                // We fetch directly; if it fails, the catch block handles it.
                const [en, ur] = await Promise.all([
                    fetch(CONFIG.HADITH_API).then(r => r.json()),
                    fetch(CONFIG.HADITH_URDU).then(r => r.json())
                ]);

                library = en.hadiths.map((h, i) => ({
                    id: h.hadithNumber,
                    en: h.text,
                    ur: ur.hadiths[i] ? ur.hadiths[i].text : "ترجمہ دستیاب نہیں",
                }));

                render(library.slice(0, 10));
            } catch (err) {
                console.error(err);
                document.getElementById('feed').innerHTML = `<div class="p-10 text-center text-red-500 font-bold">API Access Error. Please refresh or check internet.</div>`;
            }
        }

        function render(data) {
            const feed = document.getElementById('feed');
            feed.innerHTML = data.map(h => `
                <div class="glass p-8 shadow-sm border-l-4 border-emerald-500 animate-fade-in">
                    <div class="flex justify-between text-[9px] font-bold text-gray-400 mb-4 uppercase">
                        <span>Sahih Bukhari</span>
                        <span>#${h.id}</span>
                    </div>
                    <div class="font-urdu text-right text-2xl text-gray-800 mb-6">${h.ur}</div>
                    <div class="text-sm text-gray-500 italic border-t pt-4 leading-relaxed font-light">"${h.en}"</div>
                </div>
            `).join('');
        }

        function runGlobalSearch() {
            const q = document.getElementById('query').value.toLowerCase();
            const filtered = library.filter(item => item.en.toLowerCase().includes(q) || item.ur.includes(q));
            render(filtered.slice(0, 30));
        }

        window.onload = initNUR;
    </script>
</body>
</html></html>
