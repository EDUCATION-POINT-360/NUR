<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUR | Hadith Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Plus+Jakarta+Sans:wght@300;500;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F3F4F6; }
        .font-urdu { font-family: 'Noto Nastaliq Urdu', serif; line-height: 2.8; direction: rtl; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid white; border-radius: 2rem; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #10B981; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-10 text-slate-800">

    <div class="max-w-4xl mx-auto space-y-6">
        <header class="flex flex-col items-center text-center space-y-2">
            <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center shadow-inner">
                <span class="text-3xl">🌙</span>
            </div>
            <h1 class="text-3xl font-black tracking-tighter">NUR HADITH BOT</h1>
            <p class="text-[10px] font-bold text-emerald-600 uppercase tracking-[0.3em]">Verified Sahih Sources Only</p>
        </header>

        <div class="glass p-2 shadow-2xl flex items-center">
            <input type="text" id="botInput" 
                placeholder="Ask me anything (e.g. Kindness, Business, Bukhari:1)..." 
                class="w-full p-5 bg-transparent outline-none text-sm font-medium italic"
                onkeypress="if(event.key === 'Enter') askBot()">
            <button onclick="askBot()" class="bg-slate-900 text-white px-10 py-4 rounded-2xl text-xs font-bold hover:bg-emerald-600 transition-all shadow-lg uppercase">
                Ask Bot
            </button>
        </div>

        <div id="status" class="text-[9px] font-bold text-slate-400 uppercase text-center tracking-widest hidden">
            Searching the Sunnah...
        </div>

        <div id="botResponse" class="space-y-6 min-h-[400px]">
            <div class="p-20 text-center text-slate-400 italic font-light border-2 border-dashed border-slate-200 rounded-[3rem]">
                "The best among you are those who have the best manners and character."
            </div>
        </div>
    </div>

    <script>
        // STABLE MIRROR API
        const API_URL = "https://cdn.jsdelivr.net/gh/fawazaheed/hadith-api@1/editions/";
        let currentBook = "eng-bukhari";
        let urduBook = "urd-bukhari";
        let masterData = null;

        // Auto-load Bukhari on start
        window.onload = async () => {
            const res = await fetch(`${API_URL}${currentBook}.min.json`);
            const urRes = await fetch(`${API_URL}${urduBook}.min.json`);
            const enJson = await res.json();
            const urJson = await urRes.json();
            
            masterData = enJson.hadiths.map((h, i) => ({
                id: h.hadithNumber,
                en: h.text,
                ur: urJson.hadiths[i] ? urJson.hadiths[i].text : "ترجمہ دستیاب نہیں",
                grade: h.grades[0]?.grade || "Sahih"
            }));
        };

        async function askBot() {
            const query = document.getElementById('botInput').value.trim().toLowerCase();
            const responseArea = document.getElementById('botResponse');
            const status = document.getElementById('status');

            if (!query) return;

            status.style.display = 'block';
            responseArea.innerHTML = '';

            // Handle Specific Reference (e.g., 45)
            if (!isNaN(query)) {
                const h = masterData.find(x => x.id == query);
                if (h) render([h]);
                else noResult();
                return;
            }

            // Keyword Search
            const results = masterData.filter(h => 
                h.en.toLowerCase().includes(query) || h.ur.includes(query)
            ).slice(0, 10);

            if (results.length > 0) render(results);
            else noResult();
            
            status.style.display = 'none';
        }

        function render(data) {
            const area = document.getElementById('botResponse');
            area.innerHTML = data.map(h => `
                <div class="glass p-10 shadow-sm border-l-4 border-emerald-500 animate-in fade-in slide-in-from-bottom-2 duration-500">
                    <div class="flex justify-between items-center mb-8">
                        <span class="text-[10px] font-black text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full uppercase tracking-widest">Sahih Bukhari</span>
                        <span class="text-[10px] font-bold text-slate-300 tracking-tighter">HADITH #${h.id}</span>
                    </div>
                    <div class="font-urdu text-right text-2xl text-slate-800 mb-8 leading-relaxed">${h.ur}</div>
                    <div class="text-sm text-slate-500 italic font-light border-t border-slate-50 pt-8 leading-relaxed">
                        "${h.en}"
                    </div>
                </div>
            `).join('');
        }

        function noResult() {
            document.getElementById('botResponse').innerHTML = `
                <div class="p-20 text-center text-red-400 font-bold glass">
                    I couldn't find a direct match. Try keywords like 'Prayer', 'Mother', or 'Mercy'.
                </div>`;
            document.getElementById('status').style.display = 'none';
        }
    </script>
</body>
</html>
