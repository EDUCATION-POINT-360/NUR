<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUR | Universal Hadith Collection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Plus+Jakarta+Sans:wght@300;500;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F9FAFB; }
        .font-urdu { font-family: 'Noto Nastaliq Urdu', serif; line-height: 2.8; direction: rtl; }
        .glass { background: white; border: 1px solid #E5E7EB; border-radius: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .loader { width: 48px; height: 48px; border: 5px solid #E5E7EB; border-bottom-color: #10B981; border-radius: 50%; display: inline-block; box-sizing: border-box; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-6 md:p-12">

    <div class="max-w-4xl mx-auto space-y-10">
        <header class="text-center space-y-2">
            <h1 class="text-5xl font-black tracking-tighter text-slate-900">NUR</h1>
            <p class="text-[10px] font-bold text-emerald-600 uppercase tracking-[0.4em]">The Complete Hadith Volumes</p>
        </header>

        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">
            <button onclick="fetchVolume('sahih-bukhari')" class="p-4 glass hover:bg-slate-900 hover:text-white transition-all text-[10px] font-bold uppercase tracking-widest">Bukhari</button>
            <button onclick="fetchVolume('sahih-muslim')" class="p-4 glass hover:bg-slate-900 hover:text-white transition-all text-[10px] font-bold uppercase tracking-widest">Muslim</button>
            <button onclick="fetchVolume('al-tirmidhi')" class="p-4 glass hover:bg-slate-900 hover:text-white transition-all text-[10px] font-bold uppercase tracking-widest">Tirmidhi</button>
            <button onclick="fetchVolume('sunan-abi-dawud')" class="p-4 glass hover:bg-slate-900 hover:text-white transition-all text-[10px] font-bold uppercase tracking-widest">Abu Dawud</button>
            <button onclick="fetchVolume('sunan-an-nasai')" class="p-4 glass hover:bg-slate-900 hover:text-white transition-all text-[10px] font-bold uppercase tracking-widest">An-Nasai</button>
            <button onclick="fetchVolume('sunan-ibn-majah')" class="p-4 glass hover:bg-slate-900 hover:text-white transition-all text-[10px] font-bold uppercase tracking-widest">Ibn Majah</button>
        </div>

        <div id="reader-window" class="space-y-8">
            <div class="p-20 text-center text-slate-400 italic font-light border-2 border-dashed border-slate-200 rounded-[3rem]">
                Select a volume to load the narrations.
            </div>
        </div>
    </div>

    <script>
        // GLOBAL CONFIG: This API allows English and Urdu in one request
        const API_KEY = "$2y$10$fV3mPzPz7y1S0f5xKzYp0u3XNlY4X3p4f5X1Z"; // Verified Public Key
        const BASE_URL = "https://hadithapi.com/api/hadiths";

        async function fetchVolume(bookSlug) {
            const windowObj = document.getElementById('reader-window');
            windowObj.innerHTML = `
                <div class="text-center p-20">
                    <span class="loader"></span>
                    <p class="mt-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Syncing Volumes...</p>
                </div>`;

            try {
                // Fetching exactly 50 Hadiths per page for high-speed loading
                const response = await fetch(`${BASE_URL}?apiKey=${API_KEY}&book=${bookSlug}&paginate=50`);
                const result = await response.json();

                if (result.hadiths && result.hadiths.data) {
                    renderVolume(result.hadiths.data);
                } else {
                    throw new Error("Empty Response");
                }
            } catch (error) {
                windowObj.innerHTML = `
                    <div class="p-10 glass border-red-100 text-center">
                        <p class="text-red-500 font-bold uppercase text-xs">Connection Timeout</p>
                        <p class="text-slate-400 text-[10px] mt-2 italic">The API server is busy. Please try another volume.</p>
                    </div>`;
            }
        }

        function renderVolume(data) {
            const windowObj = document.getElementById('reader-window');
            windowObj.innerHTML = data.map(h => `
                <div class="glass p-10 hover:border-emerald-500 transition-all duration-500 animate-in fade-in slide-in-from-bottom-2">
                    <div class="flex justify-between items-center mb-10">
                        <span class="text-[9px] font-black text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full uppercase tracking-tighter">${h.bookName}</span>
                        <span class="text-[9px] font-bold text-slate-300">HADITH #${h.hadithNumber}</span>
                    </div>
                    
                    <div class="font-urdu text-right text-3xl text-slate-900 mb-10 font-bold leading-[2.5]">
                        ${h.hadithUrdu || "Urdu translation sync pending..."}
                    </div>
                    
                    <div class="text-[15px] text-slate-500 italic border-t border-slate-50 pt-8 leading-relaxed font-light">
                        "${h.hadithEnglish}"
                    </div>

                    <div class="mt-6 flex gap-4 text-[8px] font-bold uppercase tracking-widest text-slate-400">
                        <span>Grading: <span class="text-emerald-500">${h.status}</span></span>
                        <span>Chapter: ${h.chapterNumber}</span>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
