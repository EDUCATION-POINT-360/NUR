<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUR | The Great Collection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Plus+Jakarta+Sans:wght@300;500;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; }
        .font-urdu { font-family: 'Noto Nastaliq Urdu', serif; line-height: 2.8; direction: rtl; }
        .glass { background: white; border: 1px solid #E2E8F0; border-radius: 1.5rem; }
        .book-btn { transition: 0.3s; border: 1px solid #E2E8F0; padding: 12px; border-radius: 1rem; font-size: 10px; font-weight: 800; text-transform: uppercase; background: white;}
        .active-book { background: #111827; color: white; border-color: #111827; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-4xl mx-auto space-y-8">
        <header class="text-center">
            <h1 class="text-4xl font-black tracking-tighter italic">NUR LIBRARY</h1>
            <p class="text-[10px] font-bold text-emerald-600 uppercase tracking-widest mt-2">The Complete Dual-Language Collection</p>
        </header>

        <div class="grid grid-cols-2 md:grid-cols-6 gap-3">
            <button onclick="loadBook('bukhari', this)" class="book-btn active-book">Bukhari</button>
            <button onclick="loadBook('muslim', this)" class="book-btn">Muslim</button>
            <button onclick="loadBook('tirmidhi', this)" class="book-btn">Tirmidhi</button>
            <button onclick="loadBook('abudawood', this)" class="book-btn">Abu Dawood</button>
            <button onclick="loadBook('nasai', this)" class="book-btn">Nasai</button>
            <button onclick="loadBook('ibnmajah', this)" class="book-btn">Ibn Majah</button>
        </div>

        <hr class="border-slate-200">

        <div id="library-feed" class="space-y-8">
            <div class="p-20 text-center text-slate-400 animate-pulse">Select a book to open the collection...</div>
        </div>
    </div>

    <script>
        const API_ROOT = "https://cdn.jsdelivr.net/gh/fawazaheed/hadith-api@1/editions/";

        async function loadBook(slug, btn) {
            // Update UI
            document.querySelectorAll('.book-btn').forEach(b => b.classList.remove('active-book'));
            btn.classList.add('active-book');

            const feed = document.getElementById('library-feed');
            feed.innerHTML = '<div class="p-20 text-center text-slate-400 font-bold uppercase text-[10px] tracking-widest">Opening Volumes...</div>';

            try {
                // Fetch English and Urdu Versions
                const [enRes, urRes] = await Promise.all([
                    fetch(`${API_ROOT}eng-${slug}.min.json`),
                    fetch(`${API_ROOT}urd-${slug}.min.json`)
                ]);

                const enData = await enRes.json();
                const urData = await urRes.json();

                // Merge and Render
                renderLibrary(enData.hadiths, urData.hadiths, slug);
            } catch (err) {
                feed.innerHTML = '<div class="p-10 glass text-center text-red-500">Error: Could not load data. Check internet.</div>';
            }
        }

        function renderLibrary(enArr, urArr, bookName) {
            const feed = document.getElementById('library-feed');
            // We slice the first 100 to keep it fast. You can increase this.
            const displayData = enArr.slice(0, 100);

            feed.innerHTML = displayData.map((h, i) => `
                <div class="glass p-10 hover:shadow-lg transition-shadow">
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-[10px] font-black text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full uppercase">${bookName}</span>
                        <span class="text-[10px] font-bold text-slate-300 tracking-tighter">HADITH #${h.hadithNumber}</span>
                    </div>
                    <div class="font-urdu text-right text-3xl text-slate-800 mb-10 leading-loose">
                        ${urArr[i] ? urArr[i].text : 'ترجمہ دستیاب نہیں'}
                    </div>
                    <div class="text-[15px] text-slate-500 italic border-t border-slate-50 pt-8 leading-relaxed font-light">
                        "${h.text}"
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
