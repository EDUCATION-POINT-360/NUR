<html lang="ur">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <style>
        :root { 
            --emerald: #10b981; 
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: #f1f5f9; }
        
        body { 
            background: linear-gradient(-45deg, #f1f5f9, #e2e8f0, #f8fafc, #cbd5e1);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            display: flex; 
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .font-urdu { font-family: 'Jameel Noori Nastaleeq', serif !important; direction: rtl; line-height: 2.2; }
        .font-arabic { font-family: 'Amiri', serif !important; direction: rtl; line-height: 1.5; font-weight: 700; color: #0f172a; }

        /* Glass Sidebar */
        .glass-sidebar { 
            width: 320px; 
            background: rgba(255, 255, 255, 0.3); 
            backdrop-filter: blur(30px); 
            border-right: 1px solid var(--glass-border); 
            display: none; 
            flex-direction: column; 
            padding: 2.5rem 1.5rem; 
            z-index: 100;
        }
        @media (min-width: 1024px) { .glass-sidebar { display: flex; } }

        main { flex: 1; display: flex; flex-direction: column; height: 100dvh; position: relative; z-index: 10; }
        
        #chat-thread { 
            flex: 1; 
            overflow-y: auto; 
            padding: 1.5rem; 
            padding-bottom: 160px; 
            scroll-behavior: smooth; 
        }
        #chat-thread::-webkit-scrollbar { width: 4px; }
        #chat-thread::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.05); border-radius: 10px; }

        /* Elegant Glass Cards */
        .glass-card { 
            background: var(--glass-bg); 
            backdrop-filter: blur(20px); 
            border: 1px solid var(--glass-border); 
            border-radius: 32px; 
            margin-bottom: 2.5rem; 
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.05);
            animation: cardEnter 0.7s cubic-bezier(0.16, 1, 0.3, 1); 
            max-width: 850px; 
            margin-left: auto; 
            margin-right: auto; 
            padding: 2rem;
        }

        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* User Bubble */
        .user-bubble { 
            background: #ffffff;
            border: 1px solid var(--glass-border);
            border-radius: 24px 24px 4px 24px; 
            padding: 18px 26px; 
            color: var(--text-main); 
            max-width: 80%; 
            align-self: flex-end; 
            margin-bottom: 2rem; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        /* Floating Search Area */
        .input-area { 
            position: absolute; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            padding: 30px 20px; 
            background: linear-gradient(to top, #f1f5f9 60%, transparent);
            z-index: 50; 
        }

        .search-container { 
            background: rgba(255, 255, 255, 0.8); 
            backdrop-filter: blur(20px); 
            border: 1px solid #ffffff; 
            border-radius: 28px; 
            display: flex; 
            align-items: center; 
            max-width: 800px; 
            margin: 0 auto; 
            box-shadow: 0 15px 35px -5px rgba(0,0,0,0.08);
            transition: all 0.4s ease; 
        }

        .search-container:focus-within { 
            transform: translateY(-5px);
            box-shadow: 0 25px 50px -10px rgba(0,0,0,0.12);
            border-color: var(--emerald);
        }

        #query-input { 
            flex: 1; 
            padding: 1.25rem; 
            background: transparent; 
            outline: none; 
            font-size: 1.3rem; 
            color: #1e293b;
        }

        .load-more-btn { 
            display: flex; align-items: center; gap: 8px;
            margin: 0 auto 3rem; 
            padding: 12px 28px; 
            background: white; 
            border: 1px solid var(--glass-border); 
            border-radius: 100px; 
            color: var(--emerald); 
            font-size: 11px; 
            font-weight: 800; 
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.03);
            transition: 0.3s;
        }
        .load-more-btn:hover { background: var(--emerald); color: white; transform: scale(1.05); }

        .typing::after { content: ' ●'; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

	 <main>
        <header class="sticky top-0 w-full p-4 flex justify-between items-center bg-white/50 backdrop-blur-md border-b border-white/50 z-[110]">
           <div class="flex items-center gap-3">
               <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
               <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">NUR Ai <span class="hidden sm:inline">| Muhammad Rizwan</span></span>
           </div>
           <div class="flex gap-4 items-center">
                <i class="fa-solid fa-kaaba text-slate-400 hover:text-emerald-500 cursor-pointer"></i>
                <div class="w-8 h-8 rounded-full bg-slate-200"></div>
           </div>
        </header>
        <div id="chat-thread" class="flex flex-col">
            <div id="welcome" class="text-center py-24 px-6">
                <div class="w-24 h-24 mx-auto rounded-3xl bg-white flex items-center justify-center mb-8 border border-white shadow-2xl shadow-slate-200 rotate-3 animate-bounce">
                    <i class="fa-solid fa-book-quran text-4xl text-emerald-500"></i>
                </div>
                <h2 class="text-4xl font-bold text-slate-800 tracking-tight">Search the Truth</h2>

        <div class="input-area fixed bottom-0 left-0 right-0 p-4 md:p-10 z-50 bg-gradient-to-t from-white/90 via-white/40 to-transparent backdrop-blur-sm pb-[max(1rem,env(safe-area-inset-bottom))]">
    
    <div class="search-container relative mx-auto max-w-[850px] flex items-center p-1.5
                bg-white/40 backdrop-blur-[25px] backdrop-saturate-[180%] 
                border border-white/70 rounded-[30px] md:rounded-[40px] 
                shadow-[0_20px_50px_-12px_rgba(0,0,0,0.1)] 
                transition-all duration-700 ease-[cubic-bezier(0.23,1,0.32,1)]
                focus-within:-translate-y-3 focus-within:bg-white/80 focus-within:shadow-[0_40px_80px_-15px_rgba(16,185,129,0.3)]

        <div class="absolute inset-0 border-2 border-emerald-400/0 rounded-[30px] md:rounded-[40px] group-focus-within:border-emerald-400/30 group-focus-within:animate-pulse pointer-events-none transition-all duration-500"></div>

        <input type="text" id="query-input" placeholder="یہاں لکھیں..." 
               class="flex-1 bg-transparent border-none outline-none px-5 md:px-10 py-4 md:py-7 
                      font-urdu text-right text-xl md:text-3xl text-slate-800 placeholder-slate-400

               autocomplete="off">

        <button onclick="handleInquiry()" 
                class="relative flex-shrink-0 w-12 h-12 md:w-16 md:h-16 
                       bg-gradient-to-br from-emerald-400 to-emerald-600 
                       text-white rounded-[22px] md:rounded-[28px] 
                       flex items-center justify-center shadow-[0_10px_20px_rgba(16,185,129,0.4)]

            <i class="fa-solid fa-paper-plane text-lg md:text-2xl 
                      transition-all duration-500

            <span class="absolute inset-0 bg-white/20 opacity-0 hover:opacity-100 transition-opacity"></span>

    <div class="flex justify-center items-center gap-4 mt-6">
        <div class="h-[1px] w-10 bg-gradient-to-r from-transparent to-slate-200"></div>
        <div class="flex items-center gap-2">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-ping"></span>
            <p class="text-[9px] md:text-[10px] text-slate-400 uppercase tracking-[0.4em] font-bold">
                Encrypted Connection <span class="text-emerald-500/50 mx-1">•</span> Sahih Metadata

<style>

    #query-input {
        direction: rtl;
        -webkit-tap-highlight-color: transparent;
    }

    /* Fixed centering for FontAwesome on mobile browsers */

        display: flex !important;
        align-items: center;
        justify-content: center;
        line-height: 1 !important;
    }

    /* Shimmer Animation Keyframes */
    @keyframes shimmer {
        0% { transform: translateX(-150%) skewX(-20deg); }
        100% { transform: translateX(250%) skewX(-20deg); }
    }

    /* Ensure content stays visible above the bar */

    }

    <script>const KEY = "$2y$10$MhCtBc8HwW7yNtV8NvrNPOYPoIuhwFlJFDIUcb9agVna9Bjkwa2H6";
let qMatches = [], hMatches = [], currentIdx = 0;

// --- INITIALIZATION ---
window.addEventListener('DOMContentLoaded', () => {
    initNURSystems(); // Start Prayer Engine
});

document.getElementById('query-input').addEventListener('keypress', (e) => { 
    if(e.key === 'Enter') handleInquiry(); 
});

// --- PRAYER ENGINE (SILENT) ---
async function initNURSystems() {
    if ('serviceWorker' in navigator) {
        try {
            // Register sw.js (ensure this file exists in your root)
            await navigator.serviceWorker.register('sw.js');
            
            // Silently request notification permission
            const permission = await Notification.requestPermission();
            if (permission === 'granted') {
                autoSyncNamaz();
            }
        } catch (err) {
            console.error('NUR Engine Init Failed', err);
        }
    }
}

async function autoSyncNamaz() {
    if (!navigator.geolocation) return;

    navigator.geolocation.getCurrentPosition(async (pos) => {
        const { latitude, longitude } = pos.coords;
        try {
            const response = await fetch(`https://api.aladhan.com/v1/timings?latitude=${latitude}&longitude=${longitude}&method=1`);
            const result = await response.json();
            const timings = result.data.timings;
            
            const prayers = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
            const now = Date.now();

            navigator.serviceWorker.ready.then(reg => {
                prayers.forEach(name => {
                    const [hours, minutes] = timings[name].split(':');
                    const scheduledTime = new Date();
                    scheduledTime.setHours(parseInt(hours), parseInt(minutes), 0);

                    const delay = scheduledTime.getTime() - now;

                    if (delay > 0) {
                        reg.active.postMessage({
                            type: 'SCHEDULE_NOTIFICATION',
                            title: `Waqt-e-Namaz: ${name}`,
                            body: `It is time for ${name} prayer in your location.`,
                            prayerName: name,
                            delay: delay
                        });
                    }
                });
            });
        } catch (err) {
            console.warn("Prayer Sync Error");
        }
    }, null, { enableHighAccuracy: false });
}

// --- CORE SEARCH LOGIC ---
async function handleInquiry() {
    const input = document.getElementById('query-input');
    const val = input.value.trim();
    if(!val) return;

    document.getElementById('welcome').style.display = 'none';
    const thread = document.getElementById('chat-thread');
    
    const userDiv = document.createElement('div');
    userDiv.className = "user-bubble font-urdu text-2xl";
    userDiv.innerText = val;
    thread.appendChild(userDiv);
    
    thread.scrollTop = thread.scrollHeight;
    input.value = '';
    currentIdx = 0;

    try {
        const [qRes, hRes] = await Promise.all([
            fetch(`https://api.alquran.cloud/v1/search/${val}/all/ur.ahmedali`).then(r => r.json()),
            fetch(`https://hadithapi.com/api/hadiths?apiKey=${KEY}&hadithUrdu=${val}&paginate=10`).then(r => r.json())
        ]);

        qMatches = qRes.data?.matches || [];
        hMatches = hRes.hadiths?.data || [];
        
        const oldBtn = document.querySelector('.load-more-btn');
        if(oldBtn) oldBtn.remove();

        await renderVerifiedResult();
    } catch (e) {
        thread.innerHTML += `<div class="p-4 text-red-400 text-center text-xs font-bold uppercase">Network error. Please try again.</div>`;
    }
}

async function renderVerifiedResult() {
    const thread = document.getElementById('chat-thread');
    const cardId = 'nur_' + Date.now();
    
    const q = qMatches[currentIdx];
    const h = hMatches[currentIdx];

    if(!q && !h && currentIdx === 0) {
        thread.innerHTML += `<div class="text-center py-10 font-urdu text-slate-400 text-2xl">کوئی نتیجہ نہیں ملا۔</div>`;
        return;
    }

    const card = document.createElement('div');
    card.className = "glass-card";
    card.id = cardId;

    let cardHTML = `<div id="capture_${cardId}" class="space-y-10">`;
    
    if(q) {
        cardHTML += `
        <div class="space-y-6">
            <div class="flex justify-between items-center text-[10px] text-emerald-600 font-bold uppercase tracking-widest border-b border-emerald-100 pb-2">
                <span>Al-Qur'an</span>
                <span>Verse ${q.numberInSurah}</span>
            </div>
            <p class="font-arabic text-4xl text-right leading-relaxed" id="ar_q_${cardId}">...</p>
            <p class="font-urdu text-3xl text-right text-slate-700" id="ur_q_${cardId}"></p>
        </div>`;
    }

    if(h) {
        cardHTML += `
        <div class="${q ? 'pt-10 border-t border-slate-100' : ''} space-y-6">
            <div class="flex justify-between items-center text-[10px] text-slate-400 font-bold uppercase tracking-widest border-b border-slate-100 pb-2">
                <span>Hadith Sharif</span>
                <span>${h.bookName}</span>
            </div>
            <p class="font-arabic text-2xl text-right text-slate-600 leading-relaxed">${h.hadithArabic}</p>
            <p class="font-urdu text-2xl text-right text-slate-500" id="ur_h_${cardId}"></p>
        </div>`;
    }

    cardHTML += `</div>
        <div class="flex justify-between items-center pt-8 mt-8 border-t border-slate-100/50">
            <div class="flex gap-2">
                <button onclick="snap('${cardId}')" class="w-9 h-9 rounded-lg bg-slate-50 text-slate-400 hover:bg-emerald-50 hover:text-emerald-500 flex items-center justify-center transition-all"><i class="fa-solid fa-camera text-sm"></i></button>
                <button onclick="copyContent('${cardId}')" class="w-9 h-9 rounded-lg bg-slate-50 text-slate-400 hover:bg-emerald-50 hover:text-emerald-500 flex items-center justify-center transition-all"><i class="fa-solid fa-copy text-sm"></i></button>
            </div>
            <span class="text-[9px] text-slate-300 uppercase tracking-widest font-bold">Source Verified</span>
        </div>`;

    card.innerHTML = cardHTML;
    thread.appendChild(card);
    
    const oldBtn = document.querySelector('.load-more-btn');
    if(oldBtn) oldBtn.remove();

    if(q) {
        const ar = await fetch(`https://api.alquran.cloud/v1/ayah/${q.number}/quran-uthmani`).then(r => r.json());
        document.getElementById(`ar_q_${cardId}`).innerText = ar.data.text;
        await typeEffect(q.text, document.getElementById(`ur_q_${cardId}`));
    }
    if(h) await typeEffect(h.hadithUrdu, document.getElementById(`ur_h_${cardId}`));

    const hasMore = (currentIdx + 1 < qMatches.length) || (currentIdx + 1 < hMatches.length);
    if(hasMore) {
        const moreBtn = document.createElement('button');
        moreBtn.className = "load-more-btn";
        moreBtn.innerHTML = `Next Result <i class="fa-solid fa-chevron-down"></i>`;
        moreBtn.onclick = () => { currentIdx++; renderVerifiedResult(); };
        thread.appendChild(moreBtn);
    }
    thread.scrollTo({ top: thread.scrollHeight, behavior: 'smooth' });
}

// --- UTILITIES ---
async function typeEffect(txt, el) {
    return new Promise(res => {
        let i = 0; el.classList.add('typing');
        const t = setInterval(() => {
            el.innerText += txt.charAt(i); i++;
            if(i >= txt.length) { clearInterval(t); el.classList.remove('typing'); res(); }
            document.getElementById('chat-thread').scrollTop = document.getElementById('chat-thread').scrollHeight;
        }, 10);
    });
}

function snap(id) {
    const node = document.getElementById(`capture_${id}`);
    html2canvas(node, { backgroundColor: "#f8fafc", scale: 2 }).then(canvas => {
        const a = document.createElement('a');
        a.download = `NUR-Insight.png`;
        a.href = canvas.toDataURL();
        a.click();
    });
}

function copyContent(id) {
    const text = document.getElementById(`capture_${id}`).innerText;
    navigator.clipboard.writeText(text).then(() => alert("Copied!"));
}
	</script>
