<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUR | Hadith Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Plus+Jakarta+Sans:wght@300;500;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FAFAFA; }
        .font-urdu { font-family: 'Noto Nastaliq Urdu', serif; line-height: 3; direction: rtl; }
        .glass-ui { background: white; border: 1px solid #EEE; border-radius: 2.5rem; }
    </style>
</head>
<body class="p-6">

    <div class="max-w-2xl mx-auto space-y-8 mt-10">
        <div class="text-center space-y-3">
            <div class="inline-block p-4 bg-white rounded-full shadow-sm border border-gray-100">🌙</div>
            <h1 class="text-4xl font-black tracking-tighter">NUR BOT</h1>
            <p class="text-[10px] font-bold text-emerald-500 uppercase tracking-widest">Direct Sunnah Access</p>
        </div>

        <div class="glass-ui p-2 shadow-2xl flex items-center bg-white">
            <input type="text" id="botInput" 
                placeholder="Type a topic (e.g. Manners, Parents, Sincerity)..." 
                class="w-full p-5 outline-none text-sm italic bg-transparent">
            <button onclick="searchHadith()" class="bg-black text-white px-10 py-4 rounded-[2rem] text-xs font-bold hover:bg-emerald-600 transition-all">
                ASK
            </button>
        </div>

        <div id="resultWindow" class="space-y-6">
            <div class="p-20 text-center text-gray-300 border-2 border-dashed border-gray-100 rounded-[3rem] italic">
                Waiting for your question...
            </div>
        </div>
    </div>

    <script>
        async function searchHadith() {
            const query = document.getElementById('botInput').value.trim();
            const windowObj = document.getElementById('resultWindow');
            
            if(!query) return;

            windowObj.innerHTML = '<div class="p-20 text-center animate-pulse text-gray-400 font-bold uppercase text-[10px] tracking-widest">Searching Authenticated Mirrors...</div>';

            try {
                // Using a High-Uptime Public API Mirror
                const response = await fetch(`https://hadithapi.com/api/hadiths?apiKey=$2y$10$fV3mPzPz7y1S0f5xKzYp0u3XNlY4X3p4f5X1Z&en=${query}&paginate=5`);
                const data = await response.json();

                if (data.hadiths && data.hadiths.data.length > 0) {
                    renderResults(data.hadiths.data);
                } else {
                    windowObj.innerHTML = `<div class="p-10 glass-ui text-center text-gray-500">I couldn't find an exact match. Please try a simpler word like 'Truth' or 'Neighbor'.</div>`;
                }
            } catch (error) {
                // FAIL-SAFE: If API fails, redirect to a safe web view
                windowObj.innerHTML = `
                    <div class="p-10 glass-ui text-center space-y-4">
                        <p class="text-red-500 font-bold">Connection Timeout</p>
                        <p class="text-xs text-gray-400 uppercase font-bold">Try our Web-Mirror instead:</p>
                        <a href="https://sunnah.com/search?q=${query}" target="_blank" class="inline-block bg-emerald-500 text-white px-8 py-3 rounded-full text-[10px] font-bold uppercase tracking-widest">Open External Search</a>
                    </div>`;
            }
        }

        function renderResults(hadiths) {
            const windowObj = document.getElementById('resultWindow');
            windowObj.innerHTML = hadiths.map(h => `
                <div class="glass-ui p-10 shadow-sm border-l-8 border-emerald-400 hover:shadow-md transition-all">
                    <div class="flex justify-between text-[9px] font-black text-gray-300 uppercase tracking-tighter mb-6">
                        <span>${h.bookName}</span>
                        <span>Status: ${h.status}</span>
                    </div>
                    <div class="font-urdu text-right text-2xl text-gray-800 mb-8 leading-relaxed font-bold">${h.hadithUrdu || "Urdu text syncing..."}</div>
                    <div class="text-[13px] text-gray-500 italic border-t border-gray-50 pt-6 leading-relaxed">
                        "${h.hadithEnglish}"
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
