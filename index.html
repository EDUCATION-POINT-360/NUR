<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

          <title>NUR AI | By Muhammad Rizwan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;600&family=Plus+Jakarta+Sans:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.rawgit.com/mrasalam/Jameel-Noori-Nastaleeq-Web/master/style.css">
    
    <style>
        :root { 
            --emerald: #10b981; 
            --gold: #f59e0b;
            --bg-dark: #0f172a;
        }
        
        body { 
            background: radial-gradient(circle at top right, #1e293b, #0f172a, #020617);
            color: #f8fafc; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            overflow: hidden; 
            height: 100vh; 
        }
        
        /* Typography Perfection */
        .font-urdu { font-family: 'Jameel Noori Nastaleeq', serif !important; direction: rtl; line-height: 2.4; }
        .font-arabic { font-family: 'Amiri', serif !important; direction: rtl; line-height: 1.8; font-weight: 700; color: #f1f5f9; }
        .font-english { font-family: 'Inter', sans-serif !important; line-height: 1.6; letter-spacing: -0.01em; color: #94a3b8; }

        /* UI Elements */
        .glass-sidebar { 
            background: rgba(15, 23, 42, 0.6); 
            backdrop-filter: blur(25px); 
            border-right: 1px solid rgba(255, 255, 255, 0.05); 
        }

        .glass-card { 
            background: rgba(30, 41, 59, 0.4); 
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 32px; 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); 
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            transition: all 0.4s ease;
        }
        
        .glass-card:hover {
            border-color: rgba(16, 185, 129, 0.3);
            transform: translateY(-4px);
        }

        .search-container { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 28px; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .search-container:focus-within {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--emerald);
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.2);
        }

        /* Animations */
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        
        .typing::after { content: '●'; animation: blink 1s infinite; color: var(--emerald); margin-left: 8px; font-size: 10px; }
        @keyframes blink { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0; transform: scale(0.5); } }

        .user-bubble {
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 20px 20px 4px 20px;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2);
            .animate-fadeIn {
    animation: fadeIn 1s ease-in-out;
}

.animate-slideUp {
    animation: slideUp 1s ease-in-out 0.5s;
}

.animate-scaleX {
    animation: scaleX 1s ease-in-out 1s;
}

@keyframes fadeIn {
    0% {
        opacity: 0;
    }
    100% {
        opacity: 1;
    }
}

@keyframes slideUp {
    0% {
        transform: translateY(20px);
        opacity: 0;
    }
    100% {
        transform: translateY(0);
        opacity: 1;
    }
}

@keyframes scaleX {
    0% {
        transform: scaleX(0);
    }
    100% {
        transform: scaleX(1);
    }
}
.animate-fadeIn {
    animation: fadeIn 0.5s ease-in-out;
}

.animate-bounce {
    animation: bounce 1s infinite;
}

.animate-scaleX {
    animation: scaleX 0.5s ease-in-out;
}

@keyframes fadeIn {
    0% {
        opacity: 0;
    }
    100% {
        opacity: 1;
    }
}

@keyframes bounce {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-10px);
    }
}

@keyframes scaleX {
    0% {
        transform: scaleX(0);
    }
    100% {
        transform: scaleX(1);
    }
}

        }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        
        .glow-text { text-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
    
    </style>
</head>
<body class="flex">

    <aside class="hidden lg:flex flex-col w-80 glass-sidebar p-8">
        <div class="flex items-center gap-4 mb-16">
            <div class="w-12 h-12 bg-emerald-500 rounded-2xl flex items-center justify-center text-white shadow-[0_0_20px_rgba(16,185,129,0.5)]">
                <i class="fa-solid fa-moon text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-xl tracking-tight text-white">NUR AI</h1>
                <p class="text-[9px] text-emerald-400 font-bold uppercase tracking-widest">Divine Intelligence</p>
            </div>
        </div>
        
        <div class="flex-1 space-y-4 overflow-y-auto custom-scroll pr-2" id="history">
            <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest px-2 mb-4">Past Inquiries</p>
        </div>

        <button onclick="location.reload()" class="w-full py-4 bg-white/5 text-slate-300 border border-white/10 rounded-2xl text-[10px] font-bold uppercase tracking-widest hover:bg-emerald-600 hover:text-white transition-all active:scale-95">
            Reset Session
        </button>
    </aside>

    <main class="flex-1 flex flex-col relative overflow-hidden">
        <header class="p-6 flex justify-between items-center bg-slate-950/20 backdrop-blur-sm border-b border-white/5">
           <div class="flex items-center gap-3"><div class="w-3 h-3 rounded-full bg-emerald-500 animate-bounce shadow-[0_0_15px_#10b981]"></div><span class="text-[10px] font-bold text-emerald-400 uppercase tracking-[0.3em] animate-pulse">NUR Ai <span class="text-slate-400">By Muhammad Rizwan</span></span><div class="w-1 h-1 rounded-full bg-emerald-500 animate-ping"></div><div class="w-1 h-1 rounded-full bg-emerald-500 animate-ping delay-200"></div><div class="w-1 h-1 rounded-full bg-emerald-500 animate-ping delay-400"></div></div>

        </header>
<div id="chat-thread" class="flex-1 overflow-y-auto p-6 md:p-16 space-y-16 custom-scroll pb-48">
    <div id="welcome" class="text-center py-20 animate-pulse">
        <div class="w-20 h-20 mx-auto rounded-full bg-emerald-500/10 flex items-center justify-center mb-8 animate-bounce shadow-[0_0_30px_          
            <i class="fa-solid fa-kaaba text-4xl text-emerald-500"></i>
        </div>
        <h2 class="text-4xl font-light text-slate-300 animate-fadeIn">Light of Knowledge</h2>
        <p class="font-urdu text-2xl mt-4 text-slate-500 animate-slideUp">قرآن و حدیث کی روشنی میں تلاش کریں</p>
        <div class="mt-8 w-32 h-1 mx-auto bg-emerald-500/20 rounded-full animate-scaleX"></div>
    </div>
</div>

        
<div class="absolute bottom-0 inset-x-0 p-4 md:p-6 lg:p-10 bg-gradient-to-t from-slate-950 via-slate-950/80 to-transparent">
    <div class="max-w-4xl mx-auto search-container p-2 flex items-center">
        <input type="text" id="query-input" placeholder="اردو میں ٹائپ کریں..." class="flex-1 p-3 md:p-4 lg:p-5 bg-transparent outline-none text-lg md:text-xl lg:text-2xl font-urdu text-right text-emerald-50 placeholder-slate-600">
        <button onclick="handleInquiry()" class="w-10 h-10 md:w-12 md:h-12 lg:w-16 lg:h-16 bg-emerald-500 text-white rounded-2xl flex items-center justify-center hover:bg-emerald400 hover:rotate-12 transition-all shadow-xl shadow-emerald-900/20 active:scale-90">
            <i class="fa-solid fa-bolt-lightning text-sm md:text-lg lg:text-xl"></i>
        </button>
    </div>
</div>

</div>
       </div>

            <p class="text-center text-[9px] text-slate-600 mt-4 uppercase tracking-widest font-english">Encrypted Search • Verified Authentic Sources</p>
        </div>
    </main>

    <script>
        const KEY = "$2y$10$MhCtBc8HwW7yNtV8NvrNPOYPoIuhwFlJFDIUcb9agVna9Bjkwa2H6";
        let qMatches = [], hMatches = [], currentIdx = 0;

        document.getElementById('query-input').addEventListener('keypress', (e) => { if(e.key === 'Enter') handleInquiry(); });

        async function handleInquiry() {
            const input = document.getElementById('query-input');
            const val = input.value.trim();
            if(!val) return;

            document.getElementById('welcome').style.display = 'none';
            const thread = document.getElementById('chat-thread');
            thread.innerHTML += `<div class="self-end user-bubble px-8 py-4 text-right font-urdu text-xl ml-auto text-white">${val}</div>`;
            
            const hist = document.getElementById('history');
            hist.innerHTML = `<div class="p-4 text-[11px] bg-white/5 rounded-xl mb-2 border border-white/5 truncate text-slate-400 hover:border-emerald-500/30 transition-all cursor-default">⚡ ${val}</div>` + hist.innerHTML;

            input.value = '';
            currentIdx = 0;

            try {
                const [qRes, hRes] = await Promise.all([
                    fetch(`https://api.alquran.cloud/v1/search/${val}/all/ur.ahmedali`).then(r => r.json()),
                    fetch(`https://hadithapi.com/api/hadiths?apiKey=${KEY}&hadithUrdu=${val}&paginate=10`).then(r => r.json())
                ]);

                qMatches = qRes.data?.matches || [];
                hMatches = hRes.hadiths?.data || [];
                await renderVerifiedResult();
            } catch (e) {
                thread.innerHTML += `<div class="p-4 bg-red-500/10 text-red-400 rounded-2xl text-center font-english text-xs border border-red-500/20">Connection interrupted. Check your network.</div>`;
            }
        }

        async function renderVerifiedResult() {
            const thread = document.getElementById('chat-thread');
            const cardId = 'nur_' + Date.now();
            const q = qMatches[currentIdx];
            const h = hMatches[currentIdx];

            if(!q && !h && currentIdx === 0) {
                thread.innerHTML += `
    <div class="text-center py-10 animate-fadeIn">
        <div class="w-12 h-12 mx-auto rounded-full bg-red-500/10 flex items-center justify-center mb-4 animate-bounce">
            <i class="fa-solid fa-exclamation text-red-500"></i>
        </div>
        <p class="font-urdu text-lg text-slate-500">معذرت، کوئی نتیجہ نہیں ملا</p>
        <div class="mt-4 w-20 h-1 mx-auto bg-red-500/20 rounded-full animate-scaleX"></div>
    </div>
`;

                return;
            }

            const card = document.createElement('div');
            card.className = "glass-card p-10 md:p-16 space-y-12";
            card.id = cardId;

            card.innerHTML = `
                <div id="capture_${cardId}">
                    ${q ? `
                    <div class="space-y-10 group">
                        <div class="flex justify-between items-center opacity-50 text-[10px] font-bold uppercase tracking-[0.3em] font-english text-emerald-400">
                            <span>The Noble Quran</span>
                            <span>${q.surah.englishName} — ${q.numberInSurah}</span>
                        </div>
                        <p class="font-arabic text-5xl text-right leading-relaxed glow-text" id="ar_q_${cardId}"></p>
                        <p class="font-urdu text-4xl text-right text-emerald-400 font-bold" id="ur_q_${cardId}"></p>
                        <p class="font-english text-lg text-slate-400 font-light border-l border-emerald-500/30 pl-8 py-2" id="en_q_${cardId}"></p>
                    </div>` : ''}

                    ${h ? `
                    <div class="pt-16 mt-16 border-t border-white/5 space-y-10">
                        <div class="flex justify-between items-center opacity-50 text-[10px] font-bold uppercase tracking-[0.3em] text-blue-400 font-english">
                            <span>Prophetic Tradition</span>
                            <span>${h.bookName}</span>
                        </div>
                        <p class="font-arabic text-3xl text-right text-slate-300 leading-relaxed">${h.hadithArabic}</p>
                        <p class="font-urdu text-3xl text-right text-blue-400 font-bold" id="ur_h_${cardId}"></p>
                        <p class="font-english text-lg text-slate-500 font-light border-l border-blue-500/30 pl-8 py-2" id="en_h_${cardId}"></p>
                    </div>` : ''}
                </div>

                <div class="flex justify-between items-center pt-10 border-t border-white/5">
                    <div class="flex gap-4">
                        <button onclick="snap('${cardId}')" class="w-12 h-12 rounded-2xl bg-white/5 flex items-center justify-center text-slate-400 hover:text-emerald-400 transition-all hover:bg-white/10"><i class="fa-solid fa-camera"></i></button>
                        <button onclick="copyText('${cardId}')" class="w-12 h-12 rounded-2xl bg-white/5 flex items-center justify-center text-slate-400 hover:text-emerald-400 transition-all hover:bg-white/10"><i class="fa-solid fa-copy"></i></button>
                    </div>
                    <div class="flex items-center gap-3 text-[10px] font-bold text-slate-500 font-english uppercase tracking-widest">
                        Verified Divine Text <i class="fa-solid fa-certificate text-emerald-500"></i>
                    </div>
                </div>
            `;

            thread.appendChild(card);

            if(q) {
                const [ar, en] = await Promise.all([
                    fetch(`https://api.alquran.cloud/v1/ayah/${q.number}/quran-uthmani`).then(r => r.json()),
                    fetch(`https://api.alquran.cloud/v1/ayah/${q.number}/en.asad`).then(r => r.json())
                ]);
                document.getElementById(`ar_q_${cardId}`).innerText = ar.data.text;
                await type(q.text, document.getElementById(`ur_q_${cardId}`));
                await type(en.data.text, document.getElementById(`en_q_${cardId}`));
            }
            if(h) {
                await type(h.hadithUrdu, document.getElementById(`ur_h_${cardId}`));
                await type(h.hadithEnglish, document.getElementById(`en_h_${cardId}`));
            }

            if(qMatches.length > currentIdx + 1 || hMatches.length > currentIdx + 1) {
                const moreBtn = document.createElement('button');
                moreBtn.className = "self-center py-5 px-14 rounded-2xl border border-white/10 text-[10px] font-bold text-slate-500 uppercase tracking-[0.3em] hover:border-emerald-500/50 hover:text-emerald-400 transition-all bg-white/5 backdrop-blur-md";
                moreBtn.innerText = "Discover More Results";
                moreBtn.onclick = () => { currentIdx++; moreBtn.remove(); renderVerifiedResult(); };
                thread.appendChild(moreBtn);
            }

            thread.scrollTo({ top: thread.scrollHeight, behavior: 'smooth' });
        }

        async function type(txt, el) {
            return new Promise(res => {
                let i = 0; el.classList.add('typing');
                const t = setInterval(() => {
                    el.innerText += txt.charAt(i); i++;
                    if(i >= txt.length) { clearInterval(t); el.classList.remove('typing'); res(); }
                }, 8);
            });
        }

        function snap(id) {
            html2canvas(document.getElementById(`capture_${id}`), { backgroundColor: "#0f172a", scale: 3 }).then(c => {
                const link = document.createElement('a');
                link.download = `NUR-AI-Export.png`;
                link.href = c.toDataURL();
                link.click();
            });
        }

        function copyText(id) {
            navigator.clipboard.writeText(document.getElementById(`capture_${id}`).innerText);
            alert("Copied to clipboard.");
        }
    </script>
</body>
            </html>
