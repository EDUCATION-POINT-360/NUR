<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUR | Universal Islamic Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Plus+Jakarta+Sans:wght@300;500;800&display=swap');
        
        :root { --nur-emerald: #10B981; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8F9FA; color: #1A1A1A; }
        .font-urdu { font-family: 'Noto Nastaliq Urdu', serif; line-height: 2.8; direction: rtl; }
        
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid #EDEDED;
            border-radius: 2rem;
            transition: all 0.3s ease;
        }
        
        .nav-pill { padding: 8px 20px; border-radius: 12px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: 0.2s; }
        .nav-active { background: #1A1A1A; color: white; }
        .nav-inactive { background: white; color: #94A3B8; border: 1px solid #E2E8F0; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.5s ease-out; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-4xl mx-auto space-y-8">
        <header class="glass p-6 flex flex-wrap justify-between items-center shadow-sm gap-4">
            <div class="flex items-center gap-4">
                <div class="text-3xl font-black italic tracking-tighter">NUR</div>
                <div class="h-8 w-[1px] bg-gray-200"></div>
                <div>
                    <p id="hijri-date" class="text-[10px] font-bold text-emerald-600 uppercase tracking-widest">Loading Date...</p>
                    <p id="greg-date" class="text-[9px] text-gray-400 font-medium"></p>
                </div>
            </div>
            <div id="prayer-grid" class="flex gap-4 text-center">
                </div>
        </header>

        <nav class="flex justify-center gap-3">
            <button onclick="switchMode('hadith')" id="btn-hadith" class="nav-pill nav-active">Hadith Bot</button>
            <button onclick="switchMode('quran')" id="btn-quran" class="nav-pill nav-inactive">Quran Search</button>
        </nav>

        <div class="glass p-2 shadow-2xl flex items-center bg-white border-2 border-emerald-50">
            <input type="text" id="searchInput" placeholder="Search (e.g. 'Patience', '2:255', 'Bukhari:1')..." 
                   class="w-full p-4 outline-none text-sm italic font-light bg-transparent">
            <button onclick="masterSearch()" class="bg-black text-white px-10 py-4 rounded-2xl text-xs font-bold hover:bg-emerald-600 transition-all shadow-lg uppercase">
                Search
            </button>
        </div>

        <div id="feed" class="space-y-6">
            <div class="p-20 text-center text-gray-300 italic animate-pulse">Initializing Global Data...</div>
        </div>
    </div>

    <script>
        let currentMode = 'hadith';
        let hadithLib = [];
        
        // --- 1. SYNC PRAYER TIMES & DATE ---
        async function initDashboard() {
            try {
                const res = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Karachi&country=Pakistan&method=2');
                const d = await res.json();
                const t = d.data.timings;
                
                document.getElementById('hijri-date').innerText = `${d.data.date.hijri.day} ${d.data.date.hijri.month.en} ${d.data.date.hijri.year} AH`;
                document.getElementById('greg-date').innerText = d.data.date.readable;
                
                const prayers = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
                document.getElementById('prayer-grid').innerHTML = prayers.map(p => `
                    <div>
                        <p class="text-[8px] font-bold text-gray-400 uppercase">${p}</p>
                        <p class="text-[11px] font-black">${t[p]}</p>
                    </div>
                `).join('');
            } catch (e) { console.error("Prayer API Error"); }
        }

        // --- 2. SYNC HADITH LIBRARY (6 Books Ready) ---
        async function syncHadith() {
            try {
                const [en, ur] = await Promise.all([
                    fetch('https://cdn.jsdelivr.net/gh/fawazaheed/hadith-api@1/editions/eng-bukhari.min.json').then(r => r.json()),
                    fetch('https://cdn.jsdelivr.net/gh/fawazaheed/hadith-api@1/editions/urd-bukhari.min.json').then(r => r.json())
                ]);
                hadithLib = en.hadiths.map((h, i) => ({
                    id: h.hadithNumber,
                    en: h.text,
                    ur: ur.hadiths[i]?.text || "ترجمہ دستیاب نہیں",
                    source: "Sahih Bukhari"
                }));
                if(currentMode === 'hadith') render(hadithLib.slice(0, 5));
            } catch (e) { console.error("Hadith Sync Error"); }
        }

        // --- 3. MODE SWITCHER ---
        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('btn-hadith').className = mode === 'hadith' ? 'nav-pill nav-active' : 'nav-pill nav-inactive';
            document.getElementById('btn-quran').className = mode === 'quran' ? 'nav-pill nav-active' : 'nav-pill nav-inactive';
            document.getElementById('searchInput').placeholder = mode === 'hadith' ? "Search Hadith (e.g. 'Truth', '10')..." : "Search Quran (e.g. '2:255', 'Mercy')...";
        }

        // --- 4. MASTER SEARCH LOGIC ---
        async function masterSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const feed = document.getElementById('feed');
            feed.innerHTML = '<div class="p-20 text-center animate-pulse text-[10px] font-bold text-gray-400 uppercase">Searching...</div>';

            if (currentMode === 'quran') {
                // QURAN API CALL (Exact or Search)
                const isRef = query.includes(':');
                const url = isRef ? `https://api.alquran.cloud/v1/ayah/${query}/editions/quran-uthmani,en.sahih,ur.jalandhry` : `https://api.alquran.cloud/v1/search/${query}/all/en.sahih`;
                
                try {
                    const res = await fetch(url);
                    const data = await res.json();
                    if(isRef) {
                        const r = data.data;
                        render([{ source: `Surah ${r[0].surah.englishName}`, ur: r[2].text, en: r[1].text, id: query, ar: r[0].text }]);
                    } else {
                        const results = data.data.matches.map(m => ({ source: `Surah ${m.surah.englishName}`, en: m.text, id: `${m.surah.number}:${m.numberInSurah}`, ur: "Search results usually return English first" }));
                        render(results.slice(0, 10));
                    }
                } catch (e) { errorFeed(); }
            } else {
                // HADITH SEARCH
                const filtered = hadithLib.filter(h => h.en.toLowerCase().includes(query) || h.id == query);
                render(filtered.slice(0, 15));
            }
        }

        // --- 5. RENDER CARDS ---
        function render(data) {
            const feed = document.getElementById('feed');
            if(!data || data.length === 0) { errorFeed(); return; }
            feed.innerHTML = data.map(item => `
                <div class="glass p-10 animate-fade hover:border-emerald-200 transition-all">
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-[9px] font-black text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full uppercase tracking-tighter">${item.source}</span>
                        <span class="text-[9px] font-bold text-gray-300">REF: ${item.id}</span>
                    </div>
                    ${item.ar ? `<div class="text-right text-3xl font-serif mb-8 leading-relaxed text-gray-900" dir="rtl">${item.ar}</div>` : ''}
                    <div class="font-urdu text-right text-2xl text-gray-800 mb-8">${item.ur}</div>
                    <p class="text-sm text-gray-500 italic font-light border-t border-gray-50 pt-8 leading-relaxed">"${item.en}"</p>
                </div>
            `).join('');
        }

        function errorFeed() { document.getElementById('feed').innerHTML = '<div class="p-20 text-center text-red-400 font-bold glass">Result not found. Please try a different reference.</div>'; }

        window.onload = () => { initDashboard(); syncHadith(); };
    </script>
</body>
    </html>
