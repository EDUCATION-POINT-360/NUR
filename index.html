<html lang="en">
<head>

    <title>NUR | Hadith Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Plus+Jakarta+Sans:wght@300;500;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FDFDFD; }
        .font-urdu { font-family: 'Noto Nastaliq Urdu', serif; line-height: 3; direction: rtl; }
        .glass-ui { background: white; border: 1px solid #F0F0F0; border-radius: 2rem; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05); }
        .shimmer { background: linear-gradient(90deg, #f0f0f0 25%, #f8f8f8 50%, #f0f0f0 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { from { background-position: 200% 0; } to { background-position: -200% 0; } }

            </button>

                <div class="h-10 w-full shimmer rounded"></div>
                <div class="h-20 w-full shimmer rounded"></div>
            </div>
        </div>
