<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUR - Exact Reference</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Plus+Jakarta+Sans:wght@300;500;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F9FAFB; color: #1F2937; }
        .font-urdu { font-family: 'Noto Nastaliq Urdu', serif; line-height: 2.8; direction: rtl; }
        .glass { background: white; border: 1px solid #E5E7EB; border-radius: 2rem; shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="p-6 md:p-12">

    <div class="max-w-4xl mx-auto space-y-10">
        <header class="text-center">
            <h1 class="text-5xl font-black tracking-tighter mb-2">NUR</h1>
            <p class="text-[10px] font-bold uppercase tracking-[0.3em] text-emerald-600">Exact Quran & Hadith Reference</p>
        </header>

        <div class="glass p-3 flex flex-col md:flex-row gap-2 shadow-xl">
            <input type="text" id="refInput" placeholder="Enter Reference (e.g., 2:255 or Bukhari:1)" 
                   class="flex-1 p-4 bg-transparent outline-none text-sm font-medium italic border-b md:border-b-0 md:border-r border-gray-100">
            <button onclick="fetchExact()" class="bg-black text-white px-12 py-4 rounded-2xl text-xs font-bold hover:bg-emerald-600 transition-all uppercase">
                Fetch Exact
            </button>
        </div>

        <div id="display-area" class="space-y-6">
            <div class="p-20 text-center text-gray-400 border-2 border-dashed border-gray-200 rounded-[3rem]">
                Enter a Surah:Ayah or Book:Number to begin.
            </div>
        </div>
    </div>

    <script>
        async function fetchExact() {
            const input = document.getElementById('refInput').value.trim();
            const display = document.getElementById('display-area');
            display.innerHTML = '<div class="text-center p-10 animate-pulse font-bold text-gray-400 uppercase tracking-widest text-[10px]">Verifying Reference...</div>';

            try {
                if (input.includes(':') && !isNaN(input.split(':')[0])) {
                    // QURAN MODE (e.g., 2:255)
                    await getQuran(input);
                } else if (input.toLowerCase().includes('bukhari') || input.toLowerCase().includes('muslim')) {
                    // HADITH MODE (e.g., Bukhari:1)
                    await getHadith(input);
                } else {
                    display.innerHTML = '<div class="p-10 text-center text-red-400 font-bold">Format Error. Use "2:255" or "Bukhari:1"</div>';
                }
            } catch (e) {
                display.innerHTML = '<div class="p-10 text-center text-red-400 font-bold">Reference not found in our database.</div>';
            }
        }

        async function getQuran(ref) {
            const [surah, ayah] = ref.split(':');
            const res = await fetch(`https://api.alquran.cloud/v1/ayah/${surah}:${ayah}/editions/quran-uthmani,en.sahih,ur.jalandhry`);
            const data = await res.json();
            const results = data.data;

            renderCard({
                title: `Surah ${results[0].surah.englishName} (${ref})`,
                arabic: results[0].text,
                english: results[1].text,
                urdu: results[2].text,
                tag: "AL-QURAN"
            });
        }

        async function getHadith(ref) {
            const [book, num] = ref.split(':');
            const res = await fetch(`https://cdn.jsdelivr.net/gh/fawazaheed/hadith-api@1/editions/eng-${book.toLowerCase()}.json`);
            const urdRes = await fetch(`https://cdn.jsdelivr.net/gh/fawazaheed/hadith-api@1/editions/urd-${book.toLowerCase()}.json`);
            
            const engData = await res.json();
            const urdData = await urdRes.json();
            
            // Find specific hadith number
            const hEng = engData.hadiths.find(h => h.hadithNumber == num);
            const hUrd = urdData.hadiths.find(h => h.hadithNumber == num);

            renderCard({
                title: `${book.toUpperCase()} • HADITH #${num}`,
                arabic: "", // Some APIs don't provide raw Arabic, use Urdu/Eng
                english: hEng.text,
                urdu: hUrd.text,
                tag: "HADITH"
            });
        }

        function renderCard(data) {
            const display = document.getElementById('display-area');
            display.innerHTML = `
                <div class="glass p-10 shadow-2xl border-l-8 border-emerald-500 animate-in fade-in duration-700">
                    <div class="flex justify-between items-center mb-8">
                        <span class="text-[10px] font-black tracking-widest text-emerald-600 uppercase">${data.tag}</span>
                        <span class="text-[10px] font-bold text-gray-300">${data.title}</span>
                    </div>
                    ${data.arabic ? `<div class="text-right text-3xl font-serif mb-8 text-gray-900 leading-relaxed" dir="rtl">${data.arabic}</div>` : ''}
                    <div class="font-urdu text-right text-2xl text-gray-800 mb-8">${data.urdu}</div>
                    <div class="text-sm text-gray-500 italic font-light border-t border-gray-100 pt-8 leading-relaxed italic">
                        "${data.english}"
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
